- name: Verify Kubernetes and platform
  hosts: kube_control_plane[0]
  become: true
  gather_facts: false
  tasks:
    - name: Verify nodes
      ansible.builtin.command: kubectl get nodes -o wide
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: nodes
      changed_when: false

    - name: Verify platform pods
      ansible.builtin.command: kubectl get pods -A
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: pods
      changed_when: false

    - name: Verify ingress
      ansible.builtin.command: kubectl get ingress -A
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: ingress
      changed_when: false

    - name: Show verification
      ansible.builtin.debug:
        msg:
          - "{{ nodes.stdout }}"
          - "{{ pods.stdout }}"
          - "{{ ingress.stdout }}"
